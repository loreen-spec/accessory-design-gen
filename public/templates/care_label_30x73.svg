<svg width="30mm" height="73mm" viewBox="0 0 300 730" xmlns="http://www.w3.org/2000/svg">
  <!-- Border -->
  <rect x="5" y="5" width="290" height="720" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Content Area -->
  <g font-family="sans-serif" font-size="20" text-anchor="start" fill="black">
    
    <!-- 1. Option -->
    <text x="25" y="100" textLength="80" lengthAdjust="spacing">옵     션 :</text>
    <text x="115" y="100" id="value_option_care" font-size="18">BLACK, 100</text>
    
    <!-- 2. SKU -->
    <text x="25" y="140" textLength="80" lengthAdjust="spacing">품     번 :</text>
    <text x="115" y="140" id="value_sku_care" font-size="17">O26SE11GBK100</text>
    
    <!-- 3. Product Name -->
    <text x="25" y="180" textLength="80" lengthAdjust="spacing">제 품 명 :</text>
    <text x="115" y="180" id="value_productName_care" font-size="18">세트-윈드프릴</text>
    
    <!-- 4. Usage Age -->
    <text x="25" y="220" textLength="80" lengthAdjust="spacing">사용연령 :</text>
    <text x="115" y="220" id="value_age_care" font-size="18">4세</text>
    
    <!-- 5. Composition -->
    <text x="25" y="255" textLength="80" lengthAdjust="spacing">혼 용 률 :</text>
    <text x="115" y="255" id="value_material_care" font-size="16">폴리에스터95%, 폴리우레탄5%</text>
    <text x="115" y="290" id="value_material2_care" font-size="16"></text>
    
    <!-- 7. Washing Instructions Title -->
    <text x="25" y="320" font-weight="bold" font-size="18">세탁시 주의사항</text>
    
    <!-- 8. Washing Icons (Vector v3 Refined) -->
    <g transform="translate(36.6, 340) scale(1.11)" stroke="black" stroke-width="1" fill="none" vector-effect="non-scaling-stroke">
      <!-- 1. Hand Wash Refined -->
      <g transform="translate(0, 0)">
        <path d="M 0,12 L 4,42 L 36,42 L 40,12" />
        <path d="M 4,22 C 10,18 15,18 20,22 C 25,26 30,26 36,22" stroke-width="0.8" />
        <text x="20" y="18" font-size="8" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">손세탁</text>
        <text x="20" y="32" font-size="7" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">30℃,약</text>
        <text x="20" y="39" font-size="7" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">중성</text>
      </g>
      <!-- 2. Machine Wash (Vertical) -->
      <g transform="translate(45, 0)">
        <rect x="2" y="5" width="31" height="40" />
        <line x1="2" y1="12" x2="33" y2="12" />
        <circle cx="28" cy="8.5" r="2" />
        <text x="17.5" y="28" font-size="9" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">30℃</text>
        <text x="17.5" y="38" font-size="7" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">매우 약</text>
      </g>
      <!-- 3. Bleach (Compact Triangle) -->
      <g transform="translate(85, 0)">
        <polygon points="20,2 40,42 0,42" />
        <line x1="5" y1="12" x2="35" y2="35" stroke-width="1.2" />
        <line x1="5" y1="35" x2="35" y2="12" stroke-width="1.2" />
        <text x="20" y="27" font-size="6" text-anchor="middle" font-weight="bold" stroke="none" fill="black" font-family="sans-serif">염소</text>
        <text x="12" y="38.5" font-size="6" text-anchor="middle" font-weight="bold" stroke="none" fill="black" font-family="sans-serif">산소</text>
        <text x="28" y="38.5" font-size="6" text-anchor="middle" font-weight="bold" stroke="none" fill="black" font-family="sans-serif">표백</text>
      </g>
      <!-- 4. Dry Flat (Sun with Precise Lines) -->
      <g transform="translate(127.5, 0)">
        <circle cx="20" cy="22" r="14" />
        <!-- External Rays -->
        <line x1="20" y1="2" x2="20" y2="6" /><line x1="20" y1="38" x2="20" y2="42" />
        <line x1="0" y1="22" x2="4" y2="22" /><line x1="36" y1="22" x2="40" y2="22" />
        <line x1="6" y1="8" x2="9" y2="11" /><line x1="31" y1="33" x2="34" y2="36" />
        <line x1="6" y1="36" x2="9" y2="33" /><line x1="31" y1="11" x2="34" y2="8" />
        <!-- Inner Shading - Corrected Coordinates -->
        <g stroke-width="0.5">
          <line x1="9" y1="17" x2="17" y2="9" />
          <line x1="7" y1="24" x2="22" y2="9" />
          <line x1="11" y1="31" x2="27" y2="15" />
        </g>
        <text x="20" y="27" font-size="9" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">뉘어서</text>
      </g>
      <!-- 5. Tumble Dry (Large Circle) -->
      <g transform="translate(170, 0)">
        <rect x="0" y="2" width="40" height="40" />
        <circle cx="20" cy="22" r="17.5" />
        <line x1="0" y1="2" x2="40" y2="42" stroke-width="1.5" />
        <line x1="40" y1="2" x2="0" y2="42" stroke-width="1.5" />
        <text x="12" y="24" font-size="7" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">기계</text>
        <text x="28" y="24" font-size="7" text-anchor="middle" stroke="none" fill="black" font-family="sans-serif">건조</text>
      </g>
    </g>
    
    <!-- 9. Additional Text (Centered) -->
    <text x="150" y="425" id="value_additional_care" font-size="18" font-weight="bold" text-anchor="middle">* 진한 색상 단독 세탁 요망</text>
    
    <!-- 10. Maker -->
    <text x="25" y="470" textLength="80" lengthAdjust="spacing">제 조 사 :</text>
    <text x="115" y="470" id="value_maker_care" font-size="18">(주)오픈한</text>
    
    <!-- 12. Country -->
    <text x="25" y="505" textLength="80" lengthAdjust="spacing">제 조 국 :</text>
    <text x="115" y="505" id="value_country_care" font-size="18">중국</text>
    
    <!-- 13. Address -->
    <text x="25" y="540" textLength="80" lengthAdjust="spacing">주     소 :</text>
    <text x="115" y="540" id="value_address_care" font-size="16.1">경기도 남양주시...</text>
    <text x="115" y="575" id="value_address2_care" font-size="16.1"></text>
    
    <!-- 14. 문의 -->
    <text x="25" y="610" textLength="80" lengthAdjust="spacing">문     의 :</text>
    <text x="115" y="610" id="value_contact_care" font-size="18">070-5014-2222</text>
    
  </g>
</svg>
