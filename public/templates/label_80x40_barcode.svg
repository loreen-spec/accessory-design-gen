<svg width="80mm" height="40mm" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-size: 4pt;
      font-weight: 400;
      font-family: Arial, sans-serif;
    }
  </style>
  <rect width="80" height="40" fill="white" stroke="#000" stroke-width="0.5" rx="3" ry="3" />
  
  <!-- Line 1 -->
  <text x="4" y="8" fill="#000" xml:space="preserve">제품명:</text>
  <text id="productName" x="26" y="8" fill="#000">PRODUCT NAME</text>
  
  <!-- Line 2 -->
  <text x="4" y="14" fill="#000" xml:space="preserve">품&#160;&#160;&#160;번:</text>
  <text id="value_sku" x="26" y="14" fill="#000">000000</text>
  
  <!-- Line 3 -->
  <text x="4" y="20" fill="#000" xml:space="preserve">옵&#160;&#160;&#160;션:</text>
  <text id="optionText" x="26" y="20" fill="#000">SIZE / COLOR</text>
  
  <!-- Barcode Injection Target -->
  <g id="barcode_target" transform="translate(19, 24)"></g>
  
  <!-- Dynamic Barcode Text (Full SKU) -->
  <text id="value_fullSku" x="40" y="38" fill="#000" text-anchor="middle">0000000000000</text>
</svg>
